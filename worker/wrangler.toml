name = "haileyjam-api"
main = "src/index.js"
compatibility_date = "2026-05-01"
workers_dev = true

[[r2_buckets]]
binding = "GALLERY"
bucket_name = "hailey-jam"

[vars]
ALLOWED_ORIGINS = "https://haileyjam.com,https://www.haileyjam.com,http://localhost:3000"

[[routes]]
pattern = "api.haileyjam.nickjyeung.dev"
custom_domain = true


[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1